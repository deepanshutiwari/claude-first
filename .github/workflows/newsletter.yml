name: Daily Claude Architect Newsletter

on:
  schedule:
    # 10:00 AM EST = 15:00 UTC (adjust to 14:00 UTC for EDT / summer)
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      override_date:
        description: "Override START_DATE (YYYY-MM-DD) for testing"
        required: false
        default: ""

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Send newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          START_DATE: ${{ inputs.override_date || secrets.START_DATE }}
        run: python scripts/send_newsletter.py
